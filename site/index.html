<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subject Mixer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#151821">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: a TV-guide sidebar listing every area and subject (drawer on phones), the lineup on the right.
     Each area has its own hue, like genre colors in a listings guide. */
  :root {
    --ground: #eceef2; --surface: #ffffff; --rail: #f6f7f9; --ink: #151821; --muted: #5b6270; --line: #d6dae2;
    --c-history: #b0661a; --c-science: #0d8577; --c-tech: #4d58cf; --c-drinks: #a12d55;
    --c-culture: #8443b8; --c-world: #2471b0; --c-life: #3a8536; --c-mix: #6a7280; --c-new: #c03a2b;
    --area: var(--c-mix);
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --side: 272px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0e1117; --surface: #171b23; --rail: #12161d; --ink: #e9ebf0; --muted: #9aa2b1; --line: #262b36;
      --c-history: #e59a4a; --c-science: #3cc2ae; --c-tech: #8d95f2; --c-drinks: #e46b93;
      --c-culture: #b98be6; --c-world: #62a8e6; --c-life: #79c172; --c-mix: #9aa2b1; --c-new: #f0715f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0e1117; --surface: #171b23; --rail: #12161d; --ink: #e9ebf0; --muted: #9aa2b1; --line: #262b36;
    --c-history: #e59a4a; --c-science: #3cc2ae; --c-tech: #8d95f2; --c-drinks: #e46b93;
    --c-culture: #b98be6; --c-world: #62a8e6; --c-life: #79c172; --c-mix: #9aa2b1; --c-new: #f0715f;
    color-scheme: dark;
  }
  [data-area="history"] { --area: var(--c-history); }
  [data-area="science"] { --area: var(--c-science); }
  [data-area="tech"] { --area: var(--c-tech); }
  [data-area="drinks-food"] { --area: var(--c-drinks); }
  [data-area="culture"] { --area: var(--c-culture); }
  [data-area="world"] { --area: var(--c-world); }
  [data-area="life"] { --area: var(--c-life); }
  [data-area="mix"] { --area: var(--c-mix); }
  [data-area="new"] { --area: var(--c-new); }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.45 var(--body); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--area); outline-offset: 2px; }

  /* Sidebar guide */
  aside { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--rail); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; z-index: 20;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .brand { font: 800 20px/1 var(--display); letter-spacing: -0.02em; padding: 22px 20px 16px; display: flex; gap: 9px; align-items: center; }
  .brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--area); transition: background .3s; }
  .guide { flex: 1; overflow-y: auto; padding: 4px 10px 20px; scrollbar-width: thin; }
  .area-name { font: 700 11px/1 var(--body); letter-spacing: .13em; text-transform: uppercase; color: var(--area);
    padding: 18px 10px 7px; display: flex; gap: 7px; align-items: center; }
  .area-name::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--area); }
  .guide button { display: flex; width: 100%; justify-content: space-between; align-items: baseline; gap: 10px; text-align: left;
    border: 0; background: none; cursor: pointer; padding: 7px 10px; border-radius: 7px; font-size: 14.5px; }
  .guide button:hover { background: var(--surface); }
  .guide button small { font: 500 11.5px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .guide button[aria-current="true"] { background: var(--area); color: #fff; font-weight: 600; }
  .guide button[aria-current="true"] small { color: rgba(255,255,255,.85); }
  .prefs { border-top: 1px solid var(--line); padding: 14px 20px 18px; display: grid; gap: 12px; }
  .seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .seg button { flex: 1; border: 0; background: none; padding: 5px 8px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
  .toggle input { accent-color: var(--area); width: 15px; height: 15px; margin: 0; }

  /* Main */
  main { margin-left: var(--side); min-width: 0; padding-block: 0 56px;
    padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
  .head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 24px; padding-block: 34px 26px;
    max-width: 1400px; }
  .head > div { display: grid; gap: 6px; min-width: 0; }
  .eyebrow { font: 700 12px/1 var(--body); letter-spacing: .13em; text-transform: uppercase; color: var(--area); }
  h1 { font: 800 clamp(30px, 4.6vw, 54px)/1.02 var(--display); letter-spacing: -0.035em; margin: 0; text-wrap: balance; }
  .stats { font: 500 12.5px/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .shuffle { border: 0; border-radius: 999px; padding: 10px 20px; background: var(--area); color: #fff; font-weight: 700;
    cursor: pointer; display: inline-flex; gap: 8px; align-items: center; transition: background .3s, transform .15s; }
  .shuffle:active { transform: scale(.96); }
  .shuffle svg { width: 16px; height: 16px; }

  .grid { display: grid; gap: 28px 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 248px), 1fr)); max-width: 1400px; }
  .card { text-decoration: none; color: inherit; display: grid; gap: 9px; align-content: start; min-width: 0; }
  .thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease, filter .3s; }
  .card:hover .thumb img { transform: scale(1.04); }
  .time { position: absolute; right: 7px; bottom: 7px; background: rgba(10, 12, 16, .82); color: #fff;
    font: 500 11.5px/1 var(--mono); padding: 4px 6px; border-radius: 5px; font-variant-numeric: tabular-nums; }
  .badge { position: absolute; left: 7px; top: 7px; background: var(--ink); color: var(--ground);
    font: 600 11px/1 var(--body); padding: 4px 7px; border-radius: 5px; }
  .card h3 { font: 600 15px/1.3 var(--body); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card:hover h3 { text-decoration: underline; text-underline-offset: 3px; }
  .meta { display: flex; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; }
  .who { color: var(--area); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .when { font: 500 12px/1.6 var(--mono); white-space: nowrap; margin-left: auto; }
  .seen .thumb img { filter: grayscale(1) brightness(.75); }
  .seen h3 { color: var(--muted); }
  .more { display: block; margin: 40px auto 0; border: 1px solid var(--line); background: var(--surface);
    border-radius: 999px; padding: 10px 22px; font-weight: 600; cursor: pointer; }
  .more:hover { border-color: var(--area); }

  /* Phone: guide becomes a drawer */
  .topbar, .scrim { display: none; }
  @media (max-width: 860px) {
    aside { transform: translateX(-100%); transition: transform .25s ease; box-shadow: 0 0 40px rgba(0,0,0,.25); width: min(86vw, 320px); }
    body.open aside { transform: none; }
    .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 15; opacity: 0; pointer-events: none; transition: opacity .25s; }
    body.open .scrim { opacity: 1; pointer-events: auto; }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
    .topbar { display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
      background: var(--ground); border-bottom: 1px solid var(--line); padding-block: 10px;
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .topbar button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px;
      font-weight: 600; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
    .topbar span { font: 800 17px/1 var(--display); margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .topbar span i { width: 12px; height: 12px; border-radius: 3px; background: var(--area); }
    main { margin-left: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .head { padding-block: 22px 18px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="topbar">
  <button id="openGuide" aria-controls="guide" aria-expanded="false">☰ Subjects</button>
  <span><i></i>Subject Mixer</span>
</div>
<div class="scrim" id="scrim"></div>
<aside id="guide" aria-label="Subjects">
  <div class="brand"><i></i>Subject Mixer</div>
  <nav class="guide" id="nav"></nav>
  <div class="prefs">
    <div class="seg" id="lang" role="group" aria-label="Language">
      <button data-lang="all">All</button><button data-lang="en">English</button><button data-lang="he">עברית</button>
    </div>
    <label class="toggle"><input type="checkbox" id="hideSeen" checked> Hide watched videos</label>
  </div>
</aside>
<main>
  <section class="head">
    <div>
      <div class="eyebrow" id="eyebrow">&nbsp;</div>
      <h1 id="title">Loading your lineup…</h1>
      <div class="stats" id="stats">&nbsp;</div>
    </div>
    <button class="shuffle" id="shuffle" title="Deal a new random order for this subject">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      Shuffle
    </button>
  </section>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>Show more</button>
</main>
<script type="module">
import { mix } from './mix.js';

const PAGE = 36;
const $ = id => document.getElementById(id);
const store = {  // per-browser convenience only; the page works without it
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const seen = new Set(store.get('seen', []));
const areaSlug = a => a.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
let index, subject, data, order = [], shown = 0, lang = store.get('lang', 'all');

const fmtTime = s => {
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
};
const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function card([id, title, c, date, secs]) {
  const a = el('a', 'card' + (seen.has(id) ? ' seen' : ''));
  a.href = `https://www.youtube.com/watch?v=${id}`;
  a.target = '_blank';
  a.rel = 'noopener';
  const t = el('div', 'thumb');
  const img = el('img');
  img.alt = '';
  img.loading = 'lazy';
  img.src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
  t.append(img, el('span', 'time', fmtTime(secs)));
  if (seen.has(id)) t.append(el('span', 'badge', 'Watched'));
  const h = el('h3', null, title); h.dir = 'auto';
  const meta = el('div', 'meta');
  const who = el('span', 'who', data.channels[c].title); who.dir = 'auto';
  meta.append(who, el('span', 'when', fmtDate(date)));
  a.append(t, h, meta);
  a.addEventListener('click', () => {
    seen.add(id);
    store.set('seen', [...seen]);
    a.classList.add('seen');
  });
  return a;
}

function render(reset) {
  if (reset) { $('grid').replaceChildren(); shown = 0; }
  const next = order.slice(shown, shown + PAGE);
  $('grid').append(...next.map(card));
  shown += next.length;
  $('more').hidden = shown >= order.length;
}

function reshuffle() {
  const hide = $('hideSeen').checked;
  const pool = data.videos.filter(v =>
    (lang === 'all' || data.channels[v[2]].lang === lang) && !(hide && seen.has(v[0])));
  order = mix(pool, v => v[2]);
  const chans = new Set(pool.map(v => v[2])).size;
  const hours = Math.round(pool.reduce((t, v) => t + v[4], 0) / 3600);
  $('stats').textContent = pool.length
    ? `${pool.length.toLocaleString()} videos · ${chans} channels · ${hours.toLocaleString()} hours · refreshed ${fmtDate(index.updated)}`
    : 'Nothing left with these filters. Turn off "Hide watched videos" or pick another language.';
  render(true);
}

let entries = [];  // every openable page: subjects plus one "All <area>" per multi-subject area

function drawGuide() {
  const groups = Map.groupBy(index.subjects, s => s.area);
  entries = [];
  $('nav').replaceChildren(...[...groups].map(([area, subjects]) => {
    const g = el('div');
    g.dataset.area = areaSlug(area);
    const items = subjects.length > 1
      ? [{ name: `All ${area}`, area, slug: 'all-' + areaSlug(area), parts: subjects }, ...subjects]
      : subjects;
    g.append(el('div', 'area-name', area), ...items.map(s => {
      const b = el('button', null, s.name);
      if (s.parts) b.style.fontWeight = '600';
      else {
        b.append(el('small', null, s.channels));
        b.title = `${s.channels} channels · ${s.videos.toLocaleString()} videos`;
      }
      b.addEventListener('click', () => { open(s); setDrawer(false); });
      s.button = b;
      entries.push(s);
      return b;
    }));
    return g;
  }));
}

const load = s => fetch(`data/${s.slug}.json`).then(r => r.json());

// Combine subject files: one channel list, each video once (a channel can sit in several subjects).
function merge(files) {
  const channels = [], pos = new Map(), videos = [], seenIds = new Set();
  for (const f of files) {
    for (const v of f.videos) {
      if (seenIds.has(v[0])) continue;
      seenIds.add(v[0]);
      const ch = f.channels[v[2]];
      if (!pos.has(ch.id)) { pos.set(ch.id, channels.length); channels.push(ch); }
      videos.push([v[0], v[1], pos.get(ch.id), v[3], v[4]]);
    }
  }
  return { channels, videos };
}

function setDrawer(on) {
  document.body.classList.toggle('open', on);
  $('openGuide').setAttribute('aria-expanded', on);
}

async function open(s) {
  subject = s;
  store.set('subject', s.slug);
  document.documentElement.dataset.area = areaSlug(s.area);
  for (const x of entries) x.button.setAttribute('aria-current', x === s);
  $('eyebrow').textContent = s.area;
  $('title').textContent = s.name;
  document.title = `${s.name} · Subject Mixer`;
  $('stats').textContent = 'Loading…';
  const loaded = s.parts ? merge(await Promise.all(s.parts.map(load))) : await load(s);
  if (subject !== s) return;  // a newer click won
  data = loaded;
  if (subject === s) { reshuffle(); window.scrollTo({ top: 0 }); }
}

for (const b of $('lang').children) {
  b.setAttribute('aria-pressed', b.dataset.lang === lang);
  b.addEventListener('click', () => {
    lang = b.dataset.lang;
    store.set('lang', lang);
    for (const x of $('lang').children) x.setAttribute('aria-pressed', x === b);
    reshuffle();
  });
}
$('hideSeen').addEventListener('change', reshuffle);
$('shuffle').addEventListener('click', () => { reshuffle(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('more').addEventListener('click', () => render(false));
$('openGuide').addEventListener('click', () => setDrawer(true));
$('scrim').addEventListener('click', () => setDrawer(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') setDrawer(false); });

navigator.serviceWorker?.register('sw.js').catch(() => {});  // installable app; page works without it
index = await fetch('data/index.json').then(r => r.json());
drawGuide();
const last = store.get('subject');
const start = entries.find(s => s.slug === last) ?? entries[0];
await open(start);
start.button.scrollIntoView({ block: 'center' });
</script>
</body>
</html>
