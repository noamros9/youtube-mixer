name: Update and deploy

on:
  schedule:
    - cron: "0 9 * * *"   # daily, after the API quota resets (midnight Pacific = 08:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # for the keep-alive step below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python test_update.py && node --test site/mix.test.mjs
      - name: Fetch videos
        run: python update.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub pauses scheduled workflows after 60 days without repo activity; re-enabling resets that.
      - name: Keep schedule alive
        run: gh workflow enable update.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
